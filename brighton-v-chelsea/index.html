<script>
dash.calc('prices', {
  inputs: ['offers', 'fx'],
  title: 'Prices in US dollars',
  description: 'Each listed price per person in USD: adds VAT where prices exclude it and any booking fee, then converts pounds at the GBP/USD rate.',
  fn: (offers, fx) => {
    const rate = Number(fx[0].rate);
    return offers.map((o) => {
      const listed = o.price === null || o.price === '' || o.price === undefined ? null : Number(o.price);
      const local = listed === null ? null : listed * (String(o.vat_excluded) === 'true' ? 1.2 : 1) * (1 + Number(o.fee_pct || 0) / 100);
      const usd = local === null || o.currency === 'NOK' ? null : (o.currency === 'GBP' ? local * rate : local);
      const hi = usd === null || o.price_max === null || o.price_max === undefined || o.price_max === '' ? null : usd * (Number(o.price_max) / listed);
      return { id: o.id, pp_usd: usd === null ? null : Math.round(usd), pp_usd_max: hi === null ? null : Math.round(hi) };
    });
  },
});
</script>

<script>

  const LISTING_CLASS = { 'Brighton & Hove Albion direct': 'direct' };
  const usd = (n) => '$' + d3.format(',')(n);

  // Only the West Stand upper tier has its blocks drawn (the club's map names them); other tiers are shaded whole.
  const BANDS = [
    { stand: 'EAST', tier: 'upper', x: 96, y: 22, w: 168, h: 22, dir: 'h', ids: [] },
    { stand: 'EAST', tier: 'lower', x: 96, y: 48, w: 168, h: 18, dir: 'h', ids: [] },
    { stand: 'WEST', tier: 'lower', x: 96, y: 174, w: 168, h: 18, dir: 'h', ids: [] },
    { stand: 'WEST', tier: 'upper', x: 96, y: 196, w: 168, h: 22, dir: 'h', ids: ['W2I', 'W2H', 'W2G', 'W2F', 'W2D', 'W2C', 'W2B', 'W2A'] },
    { stand: 'NORTH', tier: 'lower', x: 72, y: 70, w: 16, h: 100, dir: 'v', ids: [] },
    { stand: 'NORTH', tier: 'upper', x: 44, y: 70, w: 24, h: 100, dir: 'v', ids: [] },
    { stand: 'SOUTH', tier: 'all', x: 272, y: 70, w: 44, h: 100, dir: 'v', ids: [] },
  ];
  const el = (name, attrs, parent) => { const n = document.createElementNS(NS, name); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); if (parent) parent.appendChild(n); return n; };

  // hl: {stand, tier, blocks[]} or {stand} for a whole-stand (lounge location) highlight

    el('circle', { cx: 180, cy: 120, r: 14, class: 'line' }, svg);
    el('rect', { x: 96, y: 98, width: 22, height: 44, class: 'line' }, svg);

    { label: 'Company', field: 'seller' },
    { label: 'Seating', field: 'seat_label' },
